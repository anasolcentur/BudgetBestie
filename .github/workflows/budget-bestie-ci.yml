name: Budget Bestie CI

on:
  push:
    branches:
      - main
      - parcial-2
  pull_request:
    branches:
      - main
      - parcial-2

jobs:
  build-test:
    name: Build and test Budget Bestie
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Show .NET version
        run: dotnet --version

      - name: Install MAUI Android workload
        run: dotnet workload install maui-android

      - name: Restore Core
        run: dotnet restore .\PocketBudget.Core\PocketBudget.Core.csproj

      - name: Restore Tests
        run: dotnet restore .\PocketBudget.Tests\PocketBudget.Tests.csproj

      - name: Restore Android app
        run: dotnet restore .\PocketBudget\PocketBudget.csproj

      - name: Build Core
        run: dotnet build .\PocketBudget.Core\PocketBudget.Core.csproj --configuration Debug

      - name: Build Android app
        run: dotnet build .\PocketBudget\PocketBudget.csproj -f net8.0-android --configuration Debug

      - name: Run tests
        run: dotnet test .\PocketBudget.Tests\PocketBudget.Tests.csproj --configuration Debug --logger "trx;LogFileName=test-results.trx"

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: "**/TestResults/*.trx"

      - name: Upload Android build output
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-build
          path: PocketBudget/bin/Debug/net8.0-android/**