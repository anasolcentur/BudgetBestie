name: Budget Bestie CI

on:
  push:
    branches:
      - main
      - parcial-2
  pull_request:
    branches:
      - main
      - parcial-2

jobs:
  build-test:
    name: Build and test Budget Bestie
    runs-on: windows-latest

    strategy:
      matrix:
        dotnet-version: ['8.0.x']
        configuration: [Debug]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ matrix.dotnet-version }}

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~\.nuget\packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Install MAUI Android workload
        run: dotnet workload install maui-android

      - name: Restore Core project
        run: dotnet restore .\PocketBudget.Core\PocketBudget.Core.csproj

      - name: Restore Tests project
        run: dotnet restore .\PocketBudget.Tests\PocketBudget.Tests.csproj

      - name: Restore Android MAUI app
        run: dotnet restore .\PocketBudget\PocketBudget.csproj -p:TargetFramework=net8.0-android

      - name: Build Core project
        run: dotnet build .\PocketBudget.Core\PocketBudget.Core.csproj --configuration ${{ matrix.configuration }} --no-restore

      - name: Build Android MAUI app
        run: dotnet build .\PocketBudget\PocketBudget.csproj -f net8.0-android --configuration ${{ matrix.configuration }} --no-restore

      - name: Run tests
        run: dotnet test .\PocketBudget.Tests\PocketBudget.Tests.csproj --configuration ${{ matrix.configuration }} --logger "trx;LogFileName=test-results.trx"

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-${{ matrix.configuration }}
          path: "**/TestResults/*.trx"

      - name: Upload Android build output
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-build-${{ matrix.configuration }}
          path: |
            PocketBudget/bin/${{ matrix.configuration }}/net8.0-android/**